<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Onlys Flans</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:#222;
    height:250px;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    overflow:hidden;
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

button{
    position:absolute;
    padding:12px 20px;
    background:#ff2d75;
    border:none;
    color:white;
    font-weight:bold;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>Onlys Flans</h1>

<div class="grid">

<div class="card" data-img="flan1.jpg">
<button onclick="reveal(this)">Descubrir / Prueba gratuita</button>
</div>

<div class="card" data-img="flan2.jpg">
<button onclick="reveal(this)">Descubrir / Prueba gratuita</button>
</div>

<div class="card" data-img="flan3.jpg">
<button onclick="reveal(this)">Descubrir / Prueba gratuita</button>
</div>

</div>

<script>
function reveal(btn){
    const card = btn.parentElement;
    const imgSrc = card.getAttribute("data-img");

    const img = document.createElement("img");
    img.src = imgSrc;

    card.innerHTML = "";
    card.appendChild(img);
}
</script>

</body>
</html>
