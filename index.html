<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Onlys Flans</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    margin-top:30px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:#222;
    height:250px;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

button{
    padding:12px 20px;
    background:#ff2d75;
    border:none;
    color:white;
    font-weight:bold;
    border-radius:8px;
    cursor:pointer;
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* pantalla suscripción */

.paywall{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
}

.paybox{
    background:#222;
    padding:30px;
    border-radius:12px;
}
</style>
</head>

<body>

<h1>Onlys Flans</h1>

<p>👀 Visitas a la página: <span id="contador"></span></p>

<div class="grid">

<div class="card" data-img="flan1.jpg">
<button onclick="openPaywall(this)">Descubrir / Prueba gratuita</button>
</div>

<div class="card" data-img="flan2.jpg">
<button onclick="openPaywall(this)">Descubrir / Prueba gratuita</button>
</div>

<div class="card" data-img="flan3.jpg">
<button onclick="openPaywall(this)">Descubrir / Prueba gratuita</button>
</div>

</div>

<!-- pantalla suscripción -->

<div class="paywall" id="paywall">
<div class="paybox">
<h2>Suscripción requerida</h2>
<p>Activa la prueba gratuita para ver el contenido</p>
<button onclick="unlock()">Activar prueba gratis</button>
</div>
</div>

<script>

/* contador visitas */

let visitas = localStorage.getItem("visitas");

if(!visitas){
visitas = 0;
}

visitas++;

localStorage.setItem("visitas", visitas);

document.getElementById("contador").textContent = visitas;


/* paywall */

let currentCard;

function openPaywall(btn){
currentCard = btn.parentElement;
document.getElementById("paywall").style.display="flex";
}

function unlock(){

const imgSrc = currentCard.getAttribute("data-img");

const img = document.createElement("img");
img.src = imgSrc;

currentCard.innerHTML="";
currentCard.appendChild(img);

document.getElementById("paywall").style.display="none";

}

</script>

</body>
</html>
