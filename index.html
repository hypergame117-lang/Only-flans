<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Onlys Flans</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#111;
    color:white;
    text-align:center;
}

h1{
    margin:30px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    position:relative;
}

.card img{
    width:100%;
    border-radius:10px;
    filter:blur(15px);
    transition:0.4s;
}

.card.revealed img{
    filter:blur(0);
}

.btn{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:#ff2d75;
    border:none;
    padding:12px 20px;
    color:white;
    font-weight:bold;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>Onlys Flans</h1>

<div class="grid">

<div class="card"> 
<img src="foto1.jpg">
<button class="btn" onclick="reveal(this)">Descubrir / Prueba gratuita</button>
</div>

<div class="card">
<img src="foto2.jpg">
<button class="btn" onclick="reveal(this)">Descubrir / Prueba gratuita</button>
</div>

<div class="card">
<img src="foto3.jpg">
<button class="btn" onclick="reveal(this)">Descubrir / Prueba gratuita</button>
</div>

</div>

<script>
function reveal(button){
    const card = button.parentElement;
    card.classList.add("revealed");
    button.style.display="none";
}
</script>

</body>
</html>
